# cargo-nextest workspace configuration for fast feedback loops vs heavy scratch/ CV suites.

[profile.default]
# Warn early if any unit test regresses in latency; fail runaway tests after 60s.
slow-timeout = { period = "15s", terminate-after = 4 }
fail-fast = false
status-level = "pass"

# Tests that install REAL global WH_KEYBOARD_LL / WH_MOUSE_LL hooks. While a low-level hook is
# installed, every system-wide key/mouse event waits on the test's hook thread, so running these
# next to CPU-heavy tests makes the user's cursor stutter and drops clicks. Each one runs alone
# (no other test process in flight). Every other test is desktop-safe (offscreen HUD, mock
# window switcher, `GH_DESKTOP_SANDBOX=1` for black-box instances).
[[profile.default.overrides]]
filter = 'test(/^hotkey::tests::(hook_lifecycle_lazy_enable_disable_and_live_rebind|stop_does_not_deadlock_when_in_flight_callback_reads_manager)$/) | test(/^state::tests::set_hotkeys_rebinding_kb_to_mouse_under_read_contention_does_not_deadlock$/)'
threads-required = "num-test-threads"

[profile.cv-heavy]
# Used with: cargo nextest run --manifest-path rust/Cargo.toml --workspace --profile cv-heavy --cargo-profile cv-bench --run-ignored all
# Serialize test processes because gh-cv uses internal rayon parallelism and asserts strict wall-clock latency bounds (<3ms, <25ms, <150ms, <400ms); concurrent test processes oversubscribe CPU cores.
test-threads = 1
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false
status-level = "pass"

# e4/e5 replay a whole M-Map drag recording (thousands of 1440p frames) — allow 60 min.
[[profile.cv-heavy.overrides]]
filter = 'test(/^e[45]_/)'
slow-timeout = { period = "60s", terminate-after = 60 }
